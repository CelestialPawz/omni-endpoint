version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - omni_data:/data
      - /home/celestialpawz/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    extra_hosts:
      - "starserver:host-gateway"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: omni-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/data/omni.db
    ports:
      - "5000:5000"
    volumes:
      - omni_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - bot

volumes:
  omni_data:
