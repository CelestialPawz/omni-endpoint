{% extends "base.html" %}

{% block content %}
<div class="container">
  <h1>🎵 Music Player</h1>

  <div class="music-container">
    <!-- Now Playing Widget -->
    <div class="now-playing">
      <div class="np-header">Now Playing</div>
      <div id="np-content" class="np-content">
        <div class="np-empty">
          <p>Nothing playing</p>
        </div>
      </div>
      <div class="controls-bar">
        <button class="btn-small" onclick="musicControl('pause')">⏸ Pause</button>
        <button class="btn-small" onclick="musicControl('resume')">▶ Resume</button>
        <button class="btn-small" onclick="musicControl('skip')">⏭ Skip</button>
        <button class="btn-small" onclick="musicControl('stop')">⏹ Stop</button>
      </div>
    </div>

    <!-- Volume & Loop -->
    <div class="player-controls">
      <div class="control-group">
        <label>Volume</label>
        <input type="range" min="1" max="100" value="50" id="volume-slider" onchange="setVolume(this.value)">
        <span id="volume-display">50%</span>
      </div>
      <div class="control-group">
        <label>Loop</label>
        <button class="btn-small" onclick="toggleLoop()">🔁 Off</button>
      </div>
    </div>

    <!-- Search & Add -->
    <div class="search-box">
      <input type="text" id="search-query" placeholder="Search YouTube or paste URL...">
      <button class="btn-primary" onclick="searchAndPlay()">🔍 Search</button>
      <button class="btn-primary" onclick="playQuery()">▶ Play</button>
    </div>

    <!-- Queue -->
    <div class="queue-section">
      <div class="queue-header">
        <h2>🎶 Queue</h2>
        <button class="btn-small" onclick="clearQueue()">Clear</button>
      </div>
      <div id="queue-content" class="queue-content">
        <p>Queue is empty</p>
      </div>
      <div class="queue-pagination">
        <button class="btn-small" onclick="prevPage()">← Prev</button>
        <span id="queue-page">Page 1</span>
        <button class="btn-small" onclick="nextPage()">Next →</button>
      </div>
    </div>

    <!-- Favorites & Playlists -->
    <div class="favorites-section">
      <div class="tabs">
        <button class="tab-btn active" onclick="showTab('favorites')">⭐ Favorites</button>
        <button class="tab-btn" onclick="showTab('playlists')">📋 Playlists</button>
      </div>

      <div id="favorites-tab" class="tab-content active">
        <div id="favorites-list" class="favorites-list">
          <p>No favorites yet</p>
        </div>
      </div>

      <div id="playlists-tab" class="tab-content">
        <div id="playlists-list" class="playlists-list">
          <p>No playlists yet</p>
        </div>
        <input type="text" id="playlist-name" placeholder="Create new playlist...">
        <button class="btn-small" onclick="createPlaylist()">Create</button>
      </div>
    </div>
  </div>
</div>

<style>
.music-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 20px;
}

.now-playing {
  grid-column: 1 / -1;
  background: #2a2a3e;
  border-radius: 8px;
  padding: 20px;
  border: 2px solid #7289da;
}

.np-header {
  font-size: 14px;
  color: #999;
  text-transform: uppercase;
  margin-bottom: 15px;
}

.np-content {
  min-height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 5px;
  margin-bottom: 15px;
  padding: 15px;
}

.np-empty {
  text-align: center;
  color: #999;
}

.np-track {
  text-align: center;
}

.np-track-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
  color: #fff;
}

.np-track-info {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 10px;
}

.np-track-thumbnail {
  width: 100%;
  max-width: 200px;
  border-radius: 5px;
  margin: 10px 0;
}

.controls-bar {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.player-controls {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  background: #2a2a3e;
  border-radius: 8px;
  padding: 15px;
}

.control-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.control-group label {
  min-width: 70px;
  font-size: 13px;
  color: #aaa;
}

.control-group input[type="range"] {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: #444;
  outline: none;
  cursor: pointer;
}

#volume-display {
  min-width: 40px;
  font-size: 13px;
}

.search-box {
  grid-column: 1 / -1;
  display: flex;
  gap: 10px;
  background: #2a2a3e;
  border-radius: 8px;
  padding: 15px;
}

.search-box input {
  flex: 1;
  padding: 10px;
  background: #1e1e2e;
  border: 1px solid #444;
  border-radius: 5px;
  color: #fff;
  font-size: 14px;
}

.search-box input::placeholder {
  color: #666;
}

.queue-section {
  grid-column: 1 / -1;
  background: #2a2a3e;
  border-radius: 8px;
  padding: 15px;
}

.queue-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.queue-header h2 {
  margin: 0;
  font-size: 16px;
}

.queue-content {
  background: rgba(0, 0, 0, 0.3);
  border-radius: 5px;
  max-height: 300px;
  overflow-y: auto;
  padding: 10px;
  margin-bottom: 10px;
}

.queue-item {
  padding: 10px;
  background: #1e1e2e;
  border-left: 3px solid #7289da;
  margin-bottom: 8px;
  border-radius: 3px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.queue-item-title {
  flex: 1;
  color: #eee;
}

.queue-item-duration {
  color: #999;
  font-size: 12px;
  margin-left: 10px;
}

.queue-item-remove {
  background: #dd5555;
  border: none;
  color: #fff;
  padding: 5px 10px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
  margin-left: 10px;
}

.queue-pagination {
  display: flex;
  justify-content: center;
  gap: 10px;
  font-size: 13px;
}

.favorites-section {
  grid-column: 1 / -1;
  background: #2a2a3e;
  border-radius: 8px;
  padding: 15px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  border-bottom: 1px solid #444;
}

.tab-btn {
  padding: 10px 15px;
  background: transparent;
  border: none;
  color: #999;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 2px solid transparent;
  transition: all 0.3s;
}

.tab-btn.active {
  color: #7289da;
  border-bottom-color: #7289da;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

.favorites-list,
.playlists-list {
  background: rgba(0, 0, 0, 0.3);
  border-radius: 5px;
  max-height: 200px;
  overflow-y: auto;
  padding: 10px;
  margin-bottom: 10px;
}

.favorite-item,
.playlist-item {
  padding: 8px;
  background: #1e1e2e;
  border-left: 3px solid #7289da;
  margin-bottom: 5px;
  border-radius: 3px;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.favorite-item-title,
.playlist-item-title {
  flex: 1;
  color: #eee;
}

.favorite-item-btn {
  background: #7289da;
  border: none;
  color: #fff;
  padding: 4px 8px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
  margin-left: 5px;
}

.btn-small {
  padding: 8px 12px;
  background: #7289da;
  border: none;
  color: #fff;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.2s;
}

.btn-small:hover {
  background: #5f7ec4;
}

.btn-primary {
  padding: 10px 15px;
  background: #7289da;
  border: none;
  color: #fff;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.2s;
}

.btn-primary:hover {
  background: #5f7ec4;
}

#playlist-name {
  padding: 8px;
  background: #1e1e2e;
  border: 1px solid #444;
  border-radius: 4px;
  color: #fff;
  width: 100%;
  margin-bottom: 10px;
  font-size: 13px;
}

@media (max-width: 768px) {
  .music-container {
    grid-template-columns: 1fr;
  }
}
</style>

<script>
let currentPage = 1;
const itemsPerPage = 10;

async function updateNowPlaying() {
  try {
    const res = await fetch('/api/music/status');
    const data = await res.json();
    
    const npContent = document.getElementById('np-content');
    if (!data.current) {
      npContent.innerHTML = '<div class="np-empty"><p>Nothing playing</p></div>';
    } else {
      const { title, url, duration, uploader, thumbnail } = data.current;
      const durationStr = formatDuration(duration);
      npContent.innerHTML = `
        <div class="np-track">
          ${thumbnail ? `<img src="${thumbnail}" class="np-track-thumbnail" alt="thumbnail">` : ''}
          <div class="np-track-title">${escapeHtml(title)}</div>
          <div class="np-track-info">
            <strong>${uploader}</strong> • <span>${durationStr}</span>
          </div>
        </div>
      `;
    }
  } catch (e) {
    console.error('Error fetching now playing:', e);
  }
}

async function updateQueue() {
  try {
    const res = await fetch(`/api/music/queue?page=${currentPage}&per_page=${itemsPerPage}`);
    const data = await res.json();
    
    const queueContent = document.getElementById('queue-content');
    if (data.queue.length === 0) {
      queueContent.innerHTML = '<p>Queue is empty</p>';
      document.getElementById('queue-page').textContent = 'Page 1';
    } else {
      queueContent.innerHTML = data.queue.map((track, i) => `
        <div class="queue-item">
          <div class="queue-item-title">${i + 1}. ${escapeHtml(track.title)}</div>
          <span class="queue-item-duration">${formatDuration(track.duration)}</span>
          <button class="queue-item-remove" onclick="removeFromQueue(${track.position})">Remove</button>
        </div>
      `).join('');
      document.getElementById('queue-page').textContent = `Page ${currentPage} of ${Math.ceil(data.total / itemsPerPage)}`;
    }
  } catch (e) {
    console.error('Error fetching queue:', e);
  }
}

async function updateFavorites() {
  try {
    const res = await fetch('/api/music/favorites');
    const favorites = await res.json();
    
    const favoritesList = document.getElementById('favorites-list');
    if (favorites.length === 0) {
      favoritesList.innerHTML = '<p>No favorites yet</p>';
    } else {
      favoritesList.innerHTML = favorites.map(fav => `
        <div class="favorite-item">
          <div class="favorite-item-title">${escapeHtml(fav.track_title)}</div>
          <button class="favorite-item-btn" onclick="playUrl('${fav.track_url}')">Play</button>
        </div>
      `).join('');
    }
  } catch (e) {
    console.error('Error fetching favorites:', e);
  }
}

async function musicControl(action) {
  try {
    const res = await fetch(`/api/music/control?action=${action}`, { method: 'POST' });
    if (res.ok) {
      updateNowPlaying();
      updateQueue();
    }
  } catch (e) {
    console.error('Error:', e);
  }
}

async function setVolume(vol) {
  try {
    await fetch(`/api/music/volume?vol=${vol}`, { method: 'POST' });
    document.getElementById('volume-display').textContent = `${vol}%`;
  } catch (e) {
    console.error('Error:', e);
  }
}

async function toggleLoop() {
  try {
    await fetch('/api/music/loop', { method: 'POST' });
    updateNowPlaying();
  } catch (e) {
    console.error('Error:', e);
  }
}

async function playQuery() {
  const query = document.getElementById('search-query').value.trim();
  if (!query) return alert('Enter a search query or URL');
  
  try {
    const res = await fetch('/api/music/play', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });
    if (res.ok) {
      document.getElementById('search-query').value = '';
      updateNowPlaying();
      updateQueue();
    }
  } catch (e) {
    console.error('Error:', e);
  }
}

async function searchAndPlay() {
  const query = document.getElementById('search-query').value.trim();
  if (!query) return alert('Enter a search query');
  
  try {
    const res = await fetch(`/api/music/search?q=${encodeURIComponent(query)}`);
    const results = await res.json();
    
    if (results.length === 0) {
      alert('No results found');
    } else {
      const url = results[0].url;
      const res2 = await fetch('/api/music/play', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: url })
      });
      if (res2.ok) {
        document.getElementById('search-query').value = '';
        updateNowPlaying();
        updateQueue();
      }
    }
  } catch (e) {
    console.error('Error:', e);
  }
}

async function removeFromQueue(position) {
  try {
    const res = await fetch(`/api/music/control?action=remove&position=${position}`, { method: 'POST' });
    if (res.ok) {
      updateQueue();
    }
  } catch (e) {
    console.error('Error:', e);
  }
}

async function playUrl(url) {
  try {
    const res = await fetch('/api/music/play', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: url })
    });
    if (res.ok) {
      updateNowPlaying();
      updateQueue();
    }
  } catch (e) {
    console.error('Error:', e);
  }
}

async function createPlaylist() {
  const name = document.getElementById('playlist-name').value.trim();
  if (!name) return alert('Enter a playlist name');
  
  try {
    const res = await fetch('/api/music/playlists', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'create', name })
    });
    if (res.ok) {
      document.getElementById('playlist-name').value = '';
      updateFavorites();  // Refresh list
    }
  } catch (e) {
    console.error('Error:', e);
  }
}

async function clearQueue() {
  if (!confirm('Clear the entire queue?')) return;
  try {
    await fetch('/api/music/control?action=clear', { method: 'POST' });
    updateQueue();
  } catch (e) {
    console.error('Error:', e);
  }
}

function showTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`${tab}-tab`).classList.add('active');
  event.target.classList.add('active');
  
  if (tab === 'favorites') updateFavorites();
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    updateQueue();
  }
}

function nextPage() {
  currentPage++;
  updateQueue();
}

function formatDuration(seconds) {
  if (!seconds) return '?';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Auto-update every 2 seconds
setInterval(() => {
  updateNowPlaying();
  updateQueue();
}, 2000);

// Initial load
updateNowPlaying();
updateQueue();
updateFavorites();
</script>
{% endblock %}
